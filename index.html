<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life - WebGPU</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        h1 {
            margin-bottom: 20px;
        }
        canvas {
            border: 2px solid #444;
            background-color: #000;
        }
        #error {
            color: #ff6b6b;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ff6b6b;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>2D Grid - WebGPU</h1>
    <canvas id="canvas" width="500" height="500"></canvas>
    <div id="error"></div>

    <script type="module">
        const canvas = document.getElementById('canvas');
        const errorDiv = document.getElementById('error');

        // Grid configuration
        const GRID_SIZE = 32;
        const CELL_SIZE = 500 / GRID_SIZE;

        async function initWebGPU() {
            // Check for WebGPU support
            if (!navigator.gpu) {
                throw new Error('WebGPU is not supported in this browser. Please use a browser with WebGPU support (Chrome/Edge 113+).');
            }

            // Request adapter and device
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                throw new Error('No appropriate GPUAdapter found.');
            }

            const device = await adapter.requestDevice();
            
            // Get WebGPU context from canvas
            const context = canvas.getContext('webgpu');
            const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
            context.configure({
                device: device,
                format: canvasFormat,
            });

            return { device, context, canvasFormat };
        }

        function createShaderModule(device, canvasFormat) {
            // Vertex shader
            const vertexShaderCode = `
                struct VertexInput {
                    @location(0) pos: vec2f,
                    @builtin(instance_index) instance: u32,
                };

                struct VertexOutput {
                    @builtin(position) pos: vec4f,
                    @location(0) cell: vec2f,
                };

                @group(0) @binding(0) var<uniform> grid: vec2f;

                @vertex
                fn vertexMain(input: VertexInput) -> VertexOutput {
                    let i = f32(input.instance);
                    let cell = vec2f(i % grid.x, floor(i / grid.x));
                    let cellOffset = cell / grid * 2.0;
                    let gridPos = (input.pos + 1.0) / grid - 1.0 + cellOffset;

                    var output: VertexOutput;
                    output.pos = vec4f(gridPos, 0.0, 1.0);
                    output.cell = cell;
                    return output;
                }
            `;

            // Fragment shader
            const fragmentShaderCode = `
                @fragment
                fn fragmentMain(@location(0) cell: vec2f) -> @location(0) vec4f {
                    // Create a checkerboard pattern
                    let c = cell / 4.0;
                    let pattern = (floor(c.x) + floor(c.y)) % 2.0;
                    
                    // Color based on position with checkerboard
                    let color = vec3f(
                        0.2 + pattern * 0.3,
                        0.3 + (cell.x / 32.0) * 0.5,
                        0.4 + (cell.y / 32.0) * 0.5
                    );
                    
                    return vec4f(color, 1.0);
                }
            `;

            const cellShaderModule = device.createShaderModule({
                label: 'Cell shader',
                code: vertexShaderCode + '\n' + fragmentShaderCode
            });

            return cellShaderModule;
        }

        function createVertexBuffer(device) {
            // Define vertices for a square (two triangles)
            const vertices = new Float32Array([
                -0.8, -0.8,  // Triangle 1
                 0.8, -0.8,
                 0.8,  0.8,

                -0.8, -0.8,  // Triangle 2
                 0.8,  0.8,
                -0.8,  0.8,
            ]);

            const vertexBuffer = device.createBuffer({
                label: 'Cell vertices',
                size: vertices.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            });

            device.queue.writeBuffer(vertexBuffer, 0, vertices);

            const vertexBufferLayout = {
                arrayStride: 8,
                attributes: [{
                    format: 'float32x2',
                    offset: 0,
                    shaderLocation: 0,
                }],
            };

            return { vertexBuffer, vertexBufferLayout };
        }

        function createUniformBuffer(device) {
            // Create a uniform buffer for the grid size
            const uniformArray = new Float32Array([GRID_SIZE, GRID_SIZE]);
            const uniformBuffer = device.createBuffer({
                label: 'Grid Uniforms',
                size: uniformArray.byteLength,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(uniformBuffer, 0, uniformArray);

            return uniformBuffer;
        }

        function createPipeline(device, cellShaderModule, vertexBufferLayout, canvasFormat, uniformBuffer) {
            const bindGroupLayout = device.createBindGroupLayout({
                label: 'Cell Bind Group Layout',
                entries: [{
                    binding: 0,
                    visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
                    buffer: {},
                }],
            });

            const bindGroup = device.createBindGroup({
                label: 'Cell renderer bind group',
                layout: bindGroupLayout,
                entries: [{
                    binding: 0,
                    resource: { buffer: uniformBuffer },
                }],
            });

            const pipelineLayout = device.createPipelineLayout({
                label: 'Cell Pipeline Layout',
                bindGroupLayouts: [bindGroupLayout],
            });

            const cellPipeline = device.createRenderPipeline({
                label: 'Cell pipeline',
                layout: pipelineLayout,
                vertex: {
                    module: cellShaderModule,
                    entryPoint: 'vertexMain',
                    buffers: [vertexBufferLayout],
                },
                fragment: {
                    module: cellShaderModule,
                    entryPoint: 'fragmentMain',
                    targets: [{
                        format: canvasFormat,
                    }],
                },
            });

            return { cellPipeline, bindGroup };
        }

        function render(device, context, cellPipeline, bindGroup, vertexBuffer) {
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    loadOp: 'clear',
                    clearValue: { r: 0, g: 0, b: 0.1, a: 1 },
                    storeOp: 'store',
                }],
            });

            pass.setPipeline(cellPipeline);
            pass.setVertexBuffer(0, vertexBuffer);
            pass.setBindGroup(0, bindGroup);
            pass.draw(6, GRID_SIZE * GRID_SIZE); // 6 vertices per cell, GRID_SIZE^2 cells

            pass.end();
            device.queue.submit([encoder.finish()]);
        }

        // Main initialization
        async function main() {
            try {
                const { device, context, canvasFormat } = await initWebGPU();
                
                const cellShaderModule = createShaderModule(device, canvasFormat);
                const { vertexBuffer, vertexBufferLayout } = createVertexBuffer(device);
                const uniformBuffer = createUniformBuffer(device);
                const { cellPipeline, bindGroup } = createPipeline(
                    device, 
                    cellShaderModule, 
                    vertexBufferLayout, 
                    canvasFormat, 
                    uniformBuffer
                );

                // Render the grid
                render(device, context, cellPipeline, bindGroup, vertexBuffer);
                
                console.log('WebGPU 2D Grid rendered successfully!');
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        main();
    </script>
</body>
</html>
